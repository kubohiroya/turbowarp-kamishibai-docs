    <rect x="44" y="106" width="170" height="34" rx="17" fill="#e8ebf2"/>
    <text x="129" y="129" text-anchor="middle" style="fill:#25283a;font-size:15px;font-weight:700">talking</text>
    <text x="44" y="164" class="small">say／think直後</text>
    <g>
