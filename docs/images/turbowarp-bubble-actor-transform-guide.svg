<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1532" height="486" viewBox="0 0 1532 486" role="img" aria-labelledby="title description">
  <title id="title">Actor相対のdistance、tail length、offset、scale</title>
  <desc id="description">実際のBubble SVG rendererで、Actor boundsからtail tipまでのdistance、本体borderまでのtail length、offsetと文字を含むscaleを比較する図。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
    .heading { fill: #25283a; font-size: 28px; font-weight: 700; }
    .subheading { fill: #25283a; font-size: 20px; font-weight: 700; }
    .body { fill: #25283a; font-size: 16px; }
    .small { fill: #667085; font-size: 13px; }
    .block-text { fill: #ffffff; font-size: 13px; font-weight: 600; }
    .input-text { fill: #25283a; font-size: 13px; font-weight: 500; }
  </style>
<rect width="1532" height="486" fill="#f2f4f8"/>
      <text x="32" y="48" class="heading">Actor相対：distance・tail・offset・scale</text>
      <text x="32" y="78" class="body">赤い点のtail tipを基準に本体を再生成。scaleはフォント、表情、アイコン、余白にも適用します。</text>
      <g data-actor-transform-scene="distance-tail">
        <rect x="32" y="112" width="472" height="340" rx="18" fill="#ffffff" stroke="#d9deea" stroke-width="2"/>
        <text x="52" y="146" class="subheading">distance 12 / tail length 18</text>
        <text x="52" y="170" class="small">Actor bounds → tail tip → Bubble border</text>
        <rect x="50" y="184" width="436" height="202" rx="10" fill="#edf3fa" stroke="#aebdd0"/>
        <rect x="106" y="246" width="66" height="92" rx="12" fill="#ffd5b5" stroke="#b85d63" stroke-width="2" data-actor-bounds="true"/>
        <text x="139" y="360" text-anchor="middle" class="small">Actor bounds</text>
        <svg x="178" y="218" width="260" height="130" viewBox="0 0 260 130" data-bubble-renderer="canonical" data-bubble-style="NORMAL" overflow="visible">
