        <circle cx="184" cy="283" r="4" fill="#ef476f"/>
        <line x1="172" y1="318" x2="184" y2="318" stroke="#ef476f" stroke-width="2"/>
        <path d="M 177 314 L 172 318 L 177 322 M 179 314 L 184 318 L 179 322" fill="none" stroke="#ef476f"/>
