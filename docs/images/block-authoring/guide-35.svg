<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
<title id="title">背景、音、待機</title>
<desc id="desc">Issue #883の新ハット形式の台本ブロック。複数のハットは独立した台本として配置します。上から順につなぎ、シーンの命令はC字の内側に配置します。入力欄の長い値は図中だけで折り返しています。</desc>
<rect width="760" height="300" rx="12" fill="#f3f6fa"/>
<g font-family="ui-monospace, Menlo, monospace" font-weight="500"><text x="24" y="30" font-size="18" fill="#172b40">背景、音、待機</text><g data-opcode="stage"><path d="M 28 64 h 16 l 5 5 h 20 l 5 -5 H 732 q 8 0 8 8 V 105 q 0 8 -8 8 H 66 l -5 5 h -20 l -5 -5 H 28 q -8 0 -8 -8 V 74 Z" fill="#086f78" stroke="#fff" stroke-width="1"/><text x="34" y="93" fill="#fff" font-size="16">set stage backdrop </text><rect x="224.43999999999997" y="74" width="61.75" height="27" rx="6" fill="#fff"/><text x="232.43999999999997" y="93" fill="#172b40" font-size="15">Beach</text></g><g data-opcode="bgm"><path d="M 28 116 h 16 l 5 5 h 20 l 5 -5 H 732 q 8 0 8 8 V 157 q 0 8 -8 8 H 66 l -5 5 h -20 l -5 -5 H 28 q -8 0 -8 -8 V 126 Z" fill="#086f78" stroke="#fff" stroke-width="1"/><text x="34" y="145" fill="#fff" font-size="16">play BGM </text><rect x="126.84" y="126" width="125.80000000000003" height="27" rx="6" fill="#fff"/><text x="134.84" y="145" fill="#172b40" font-size="15">OpeningSound</text></g><g data-opcode="sound"><path d="M 28 168 h 16 l 5 5 h 20 l 5 -5 H 732 q 8 0 8 8 V 209 q 0 8 -8 8 H 66 l -5 5 h -20 l -5 -5 H 28 q -8 0 -8 -8 V 178 Z" fill="#086f78" stroke="#fff" stroke-width="1"/><text x="34" y="197" fill="#fff" font-size="16">play sound </text><rect x="146.36" y="178" width="80.05" height="27" rx="6" fill="#fff"/><text x="154.36" y="197" fill="#172b40" font-size="15">Success</text><text x="231.41000000000003" y="197" fill="#fff" font-size="16"> until done</text></g><g data-opcode="wait"><path d="M 28 220 h 16 l 5 5 h 20 l 5 -5 H 732 q 8 0 8 8 V 261 q 0 8 -8 8 H 66 l -5 5 h -20 l -5 -5 H 28 q -8 0 -8 -8 V 230 Z" fill="#086f78" stroke="#fff" stroke-width="1"/><text x="34" y="249" fill="#fff" font-size="16">wait </text><rect x="87.8" y="230" width="43.45" height="27" rx="6" fill="#fff"/><text x="95.8" y="249" fill="#172b40" font-size="15">1.5</text><text x="136.25" y="249" fill="#fff" font-size="16"> seconds</text></g></g>
</svg>
