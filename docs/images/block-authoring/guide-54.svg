<svg xmlns="http://www.w3.org/2000/svg" width="760" height="176" viewBox="0 0 760 176" role="img" aria-labelledby="title desc">
<title id="title">透明度を変える</title>
<desc id="desc">Issue #883の統一ハットとIssue #886の種類別定義ブロック。複数のハットは独立した台本として配置します。上から順につなぎ、シーンの命令はC字の内側に配置します。入力欄の長い値は図中だけで折り返しています。</desc>
<rect width="760" height="176" rx="12" fill="#f3f6fa"/>
<g font-family="ui-monospace, Menlo, monospace" font-weight="500"><text x="24" y="30" font-size="18" fill="#172b40">透明度を変える</text><g data-opcode="setTransparency"><path d="M 28 64 h 16 l 5 5 h 20 l 5 -5 H 732 q 8 0 8 8 V 137 q 0 8 -8 8 H 66 l -5 5 h -20 l -5 -5 H 28 q -8 0 -8 -8 V 74 Z" fill="#086f78" stroke="#fff" stroke-width="1"/><text x="34" y="93" fill="#fff" font-size="16">set actor </text><rect x="136.60000000000002" y="74" width="52.6" height="27" rx="6" fill="#fff"/><text x="144.60000000000002" y="93" fill="#172b40" font-size="15">Hero</text><text x="194.20000000000002" y="93" fill="#fff" font-size="16"> transparency spec </text><rect x="34" y="106" width="455.19999999999965" height="27" rx="6" fill="#fff"/><text x="42" y="125" fill="#172b40" font-size="15">{&quot;from&quot;:0,&quot;to&quot;:50,&quot;seconds&quot;:1,&quot;background&quot;:true}</text></g></g>
</svg>
