<svg xmlns="http://www.w3.org/2000/svg" width="760" height="239" viewBox="0 0 760 239" role="img" aria-labelledby="title desc">
<title id="title">Web上のファイル（remote）の内容を固定する</title>
<desc id="desc">Issue #881の開発版の台本ブロック。上から順につなぎ、シーンの命令はC字の内側に配置します。入力欄の長い値は図中だけで折り返しています。</desc>
<rect width="760" height="239" rx="12" fill="#f3f6fa"/>
<g font-family="ui-monospace, Menlo, monospace" font-weight="500"><text x="24" y="30" font-size="18" fill="#172b40">Web上のファイル（remote）の内容を固定する</text><g data-opcode="property"><path d="M 28 64 h 16 l 5 5 h 20 l 5 -5 H 732 q 8 0 8 8 V 200 q 0 8 -8 8 H 66 l -5 5 h -20 l -5 -5 H 28 q -8 0 -8 -8 V 74 Z" fill="#683f8f" stroke="#fff" stroke-width="1"/><text x="34" y="93" fill="#fff" font-size="16">story property </text><rect x="185.4" y="74" width="235.60000000000008" height="27" rx="6" fill="#fff"/><text x="193.4" y="93" fill="#172b40" font-size="15">[&quot;assets&quot;,&quot;EndingTheme&quot;]</text><text x="426.0000000000001" y="93" fill="#fff" font-size="16"> = JSON </text><rect x="34" y="106" width="683.9499999999991" height="90" rx="6" fill="#fff"/><text x="42" y="125" fill="#172b40" font-size="15">{&quot;kind&quot;:&quot;sound&quot;,&quot;delivery&quot;:&quot;remote&quot;,&quot;loading&quot;:&quot;lazy&quot;,&quot;source&quot;:{&quot;url&quot;:&quot;htt</text><text x="42" y="146" fill="#172b40" font-size="15">ps://example.com/kamishibai/ending.ogg&quot;,&quot;integrity&quot;:&quot;sha256-0123456789abc</text><text x="42" y="167" fill="#172b40" font-size="15">def0123456789abcdef0123456789abcdef0123456789abcdef&quot;,&quot;contentType&quot;:&quot;audio</text><text x="42" y="188" fill="#172b40" font-size="15">/ogg&quot;,&quot;size&quot;:1024}}</text></g></g>
</svg>
