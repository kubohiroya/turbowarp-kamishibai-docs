<svg xmlns="http://www.w3.org/2000/svg" width="760" height="307" viewBox="0 0 760 307" role="img" aria-labelledby="title desc">
<title id="title">SVG Textを更新する</title>
<desc id="desc">Issue #883の新ハット形式の台本ブロック。複数のハットは独立した台本として配置します。上から順につなぎ、シーンの命令はC字の内側に配置します。入力欄の長い値は図中だけで折り返しています。</desc>
<rect width="760" height="307" rx="12" fill="#f3f6fa"/>
<g font-family="ui-monospace, Menlo, monospace" font-weight="500"><text x="24" y="30" font-size="18" fill="#172b40">SVG Textを更新する</text><g data-opcode="actionOptions"><path d="M 28 64 h 16 l 5 5 h 20 l 5 -5 H 732 q 8 0 8 8 V 105 q 0 8 -8 8 H 52 q -8 0 -8 8 V 248 q 0 8 8 8 H 732 q 8 0 8 8 V 268 q 0 8 -8 8 H 66 l -5 5 h -20 l -5 -5 H 28 q -8 0 -8 -8 V 72 q 0 -8 8 -8 Z" fill="#683f8f" stroke="#fff" stroke-width="1"/><text x="34" y="93" fill="#fff" font-size="16">action options JSON </text><rect x="234.19999999999996" y="74" width="345.3999999999999" height="27" rx="6" fill="#fff"/><text x="242.19999999999996" y="93" fill="#172b40" font-size="15">{&quot;arguments&quot;:{},&quot;textFormat&quot;:&quot;json&quot;}</text><g data-opcode="setText"><path d="M 52 117 h 16 l 5 5 h 20 l 5 -5 H 732 q 8 0 8 8 V 243 q 0 8 -8 8 H 90 l -5 5 h -20 l -5 -5 H 52 q -8 0 -8 -8 V 127 Z" fill="#086f78" stroke="#fff" stroke-width="1"/><text x="58" y="146" fill="#fff" font-size="16">set text actor </text><rect x="209.4" y="127" width="80.05" height="27" rx="6" fill="#fff"/><text x="217.4" y="146" fill="#172b40" font-size="15">Caption</text><text x="294.45" y="146" fill="#fff" font-size="16"> to </text><rect x="58" y="159" width="657.8499999999996" height="48" rx="6" fill="#fff"/><text x="66" y="178" fill="#172b40" font-size="15">[&quot;むかしむかし、&quot;,{&quot;ruby&quot;:{&quot;base&quot;:&quot;竹取&quot;,&quot;reading&quot;:&quot;たけとり&quot;}},&quot;の翁がいまし</text><text x="66" y="199" fill="#172b40" font-size="15">た。&quot;]</text><text x="58" y="231" fill="#fff" font-size="16"> style </text><rect x="131.32" y="212" width="61.75" height="27" rx="6" fill="#fff"/><text x="139.32" y="231" fill="#172b40" font-size="15">title</text></g></g></g>
</svg>
