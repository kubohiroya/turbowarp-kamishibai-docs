<svg xmlns="http://www.w3.org/2000/svg" width="760" height="248" viewBox="0 0 760 248" role="img" aria-labelledby="title desc">
<title id="title">変数</title>
<desc id="desc">Issue #883の新ハット形式の台本ブロック。複数のハットは独立した台本として配置します。上から順につなぎ、シーンの命令はC字の内側に配置します。入力欄の長い値は図中だけで折り返しています。</desc>
<rect width="760" height="248" rx="12" fill="#f3f6fa"/>
<g font-family="ui-monospace, Menlo, monospace" font-weight="500"><text x="24" y="30" font-size="18" fill="#172b40">変数</text><g data-opcode="setVariable"><path d="M 28 64 h 16 l 5 5 h 20 l 5 -5 H 732 q 8 0 8 8 V 105 q 0 8 -8 8 H 66 l -5 5 h -20 l -5 -5 H 28 q -8 0 -8 -8 V 74 Z" fill="#086f78" stroke="#fff" stroke-width="1"/><text x="34" y="93" fill="#fff" font-size="16">set story variable </text><rect x="224.43999999999997" y="74" width="107.50000000000001" height="27" rx="6" fill="#fff"/><text x="232.43999999999997" y="93" fill="#172b40" font-size="15">playerName</text><text x="336.94" y="93" fill="#fff" font-size="16"> to </text><rect x="380.98" y="74" width="46" height="27" rx="6" fill="#fff"/><text x="388.98" y="93" fill="#172b40" font-size="15">うみ</text><text x="431.98" y="93" fill="#fff" font-size="16"> as </text><rect x="476.02000000000004" y="74" width="70.9" height="27" rx="6" fill="#fff"/><text x="484.02000000000004" y="93" fill="#172b40" font-size="15">string</text></g><g data-opcode="changeVariable"><path d="M 28 116 h 16 l 5 5 h 20 l 5 -5 H 732 q 8 0 8 8 V 157 q 0 8 -8 8 H 66 l -5 5 h -20 l -5 -5 H 28 q -8 0 -8 -8 V 126 Z" fill="#086f78" stroke="#fff" stroke-width="1"/><text x="34" y="145" fill="#fff" font-size="16">change story variable </text><rect x="253.71999999999994" y="126" width="61.75" height="27" rx="6" fill="#fff"/><text x="261.7199999999999" y="145" fill="#172b40" font-size="15">score</text><text x="320.4699999999999" y="145" fill="#fff" font-size="16"> by </text><rect x="364.50999999999993" y="126" width="25.15" height="27" rx="6" fill="#fff"/><text x="372.50999999999993" y="145" fill="#172b40" font-size="15">1</text></g><g data-opcode="toggleVariable"><path d="M 28 168 h 16 l 5 5 h 20 l 5 -5 H 732 q 8 0 8 8 V 209 q 0 8 -8 8 H 66 l -5 5 h -20 l -5 -5 H 28 q -8 0 -8 -8 V 178 Z" fill="#086f78" stroke="#fff" stroke-width="1"/><text x="34" y="197" fill="#fff" font-size="16">toggle story variable </text><rect x="253.71999999999994" y="178" width="125.80000000000003" height="27" rx="6" fill="#fff"/><text x="261.7199999999999" y="197" fill="#172b40" font-size="15">takeSeaRoute</text></g></g>
</svg>
