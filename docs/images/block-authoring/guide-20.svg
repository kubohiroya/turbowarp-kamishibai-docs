<svg xmlns="http://www.w3.org/2000/svg" width="760" height="323" viewBox="0 0 760 323" role="img" aria-labelledby="title desc">
<title id="title">セリフの見た目（bubble style）を設定する</title>
<desc id="desc">Issue #883の新ハット形式の台本ブロック。複数のハットは独立した台本として配置します。上から順につなぎ、シーンの命令はC字の内側に配置します。入力欄の長い値は図中だけで折り返しています。</desc>
<rect width="760" height="323" rx="12" fill="#f3f6fa"/>
<g font-family="ui-monospace, Menlo, monospace" font-weight="500"><text x="24" y="30" font-size="18" fill="#172b40">セリフの見た目（bubble style）を設定する</text><g data-opcode="property"><path d="M 28 64 h 16 l 5 5 h 20 l 5 -5 H 732 q 8 0 8 8 V 179 q 0 8 -8 8 H 66 l -5 5 h -20 l -5 -5 H 28 q -8 0 -8 -8 V 74 Z" fill="#683f8f" stroke="#fff" stroke-width="1"/><text x="34" y="93" fill="#fff" font-size="16">story property </text><rect x="185.4" y="74" width="244.75000000000009" height="27" rx="6" fill="#fff"/><text x="193.4" y="93" fill="#172b40" font-size="15">[&quot;bubbleStyles&quot;,&quot;Typing&quot;]</text><text x="435.1500000000001" y="93" fill="#fff" font-size="16"> = JSON </text><rect x="34" y="106" width="685.7499999999992" height="69" rx="6" fill="#fff"/><text x="42" y="125" fill="#172b40" font-size="15">{&quot;characterIntervalSeconds&quot;:0.05,&quot;characterSound&quot;:&quot;Typewriter&quot;,&quot;noSoundCh</text><text x="42" y="146" fill="#172b40" font-size="15">aracters&quot;:&quot;「」&quot;,&quot;restCharacters&quot;:&quot;、。…&quot;,&quot;restCharacterIntervalSeconds&quot;:0</text><text x="42" y="167" fill="#172b40" font-size="15">.5}</text></g><g data-opcode="property"><path d="M 28 190 h 16 l 5 5 h 20 l 5 -5 H 732 q 8 0 8 8 V 284 q 0 8 -8 8 H 66 l -5 5 h -20 l -5 -5 H 28 q -8 0 -8 -8 V 200 Z" fill="#683f8f" stroke="#fff" stroke-width="1"/><text x="34" y="219" fill="#fff" font-size="16">story property </text><rect x="185.4" y="200" width="281.3500000000001" height="27" rx="6" fill="#fff"/><text x="193.4" y="219" fill="#172b40" font-size="15">[&quot;bubbleStyles&quot;,&quot;Hero style&quot;]</text><text x="471.7500000000001" y="219" fill="#fff" font-size="16"> = JSON </text><rect x="34" y="232" width="683.9499999999991" height="48" rx="6" fill="#fff"/><text x="42" y="251" fill="#172b40" font-size="15">{&quot;styles&quot;:[&quot;Typing&quot;],&quot;textStyle&quot;:&quot;title&quot;,&quot;placement&quot;:&quot;FOOTER_LIKE&quot;,&quot;visua</text><text x="42" y="272" fill="#172b40" font-size="15">lStyle&quot;:&quot;NARRATION&quot;}</text></g></g>
