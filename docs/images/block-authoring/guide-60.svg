<svg xmlns="http://www.w3.org/2000/svg" width="760" height="196" viewBox="0 0 760 196" role="img" aria-labelledby="title desc">
<title id="title">重なり順を変える</title>
<desc id="desc">Issue #883の統一ハットとIssue #886の種類別定義ブロック。複数のハットは独立した台本として配置します。上から順につなぎ、シーンの命令はC字の内側に配置します。入力欄の長い値は図中だけで折り返しています。</desc>
<rect width="760" height="196" rx="12" fill="#f3f6fa"/>
<g font-family="ui-monospace, Menlo, monospace" font-weight="500"><text x="24" y="30" font-size="18" fill="#172b40">重なり順を変える</text><g data-opcode="setLayer"><path d="M 28 64 h 16 l 5 5 h 20 l 5 -5 H 732 q 8 0 8 8 V 105 q 0 8 -8 8 H 66 l -5 5 h -20 l -5 -5 H 28 q -8 0 -8 -8 V 74 Z" fill="#086f78" stroke="#fff" stroke-width="1"/><text x="34" y="93" fill="#fff" font-size="16">set actor </text><rect x="136.60000000000002" y="74" width="52.6" height="27" rx="6" fill="#fff"/><text x="144.60000000000002" y="93" fill="#172b40" font-size="15">Hero</text><text x="194.20000000000002" y="93" fill="#fff" font-size="16"> layer </text><rect x="267.52" y="74" width="61.75" height="27" rx="6" fill="#fff"/><text x="275.52" y="93" fill="#172b40" font-size="15">front</text></g><g data-opcode="setLayer"><path d="M 28 116 h 16 l 5 5 h 20 l 5 -5 H 732 q 8 0 8 8 V 157 q 0 8 -8 8 H 66 l -5 5 h -20 l -5 -5 H 28 q -8 0 -8 -8 V 126 Z" fill="#086f78" stroke="#fff" stroke-width="1"/><text x="34" y="145" fill="#fff" font-size="16">set actor </text><rect x="136.60000000000002" y="126" width="61.75" height="27" rx="6" fill="#fff"/><text x="144.60000000000002" y="145" fill="#172b40" font-size="15">Guide</text><text x="203.35000000000002" y="145" fill="#fff" font-size="16"> layer </text><rect x="276.67" y="126" width="34.3" height="27" rx="6" fill="#fff"/><text x="284.67" y="145" fill="#172b40" font-size="15">-1</text></g></g>
