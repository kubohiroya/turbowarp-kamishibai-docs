<svg xmlns="http://www.w3.org/2000/svg" width="760" height="197" viewBox="0 0 760 197" role="img" aria-labelledby="title desc">
<title id="title">ポーズを認識する</title>
<desc id="desc">Issue #883の新ハット形式の台本ブロック。複数のハットは独立した台本として配置します。上から順につなぎ、シーンの命令はC字の内側に配置します。入力欄の長い値は図中だけで折り返しています。</desc>
