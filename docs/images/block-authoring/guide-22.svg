<svg xmlns="http://www.w3.org/2000/svg" width="760" height="396" viewBox="0 0 760 396" role="img" aria-labelledby="title desc">
<title id="title">吹き出しを閉じる条件（bubble close policy）を設定する（1/2）</title>
<desc id="desc">Issue #881の開発版の台本ブロック。上から順につなぎ、シーンの命令はC字の内側に配置します。入力欄の長い値は図中だけで折り返しています。</desc>
<rect width="760" height="396" rx="12" fill="#f3f6fa"/>
<g font-family="ui-monospace, Menlo, monospace" font-weight="500"><text x="24" y="30" font-size="18" fill="#172b40">吹き出しを閉じる条件（bubble close policy）を設定する（1/2）</text><g data-opcode="whenDsl4Source"><path d="M 20 74 Q 44 52 88 66 H 732 q 8 0 8 8 V 105 q 0 8 -8 8 H 66 l -5 5 h -20 l -5 -5 H 28 q -8 0 -8 -8 V 74 Z" fill="#086f78" stroke="#fff" stroke-width="1"/><text x="34" y="93" fill="#fff" font-size="16">when kamishibai DSL source</text></g><g data-opcode="property"><path d="M 28 116 h 16 l 5 5 h 20 l 5 -5 H 732 q 8 0 8 8 V 189 q 0 8 -8 8 H 66 l -5 5 h -20 l -5 -5 H 28 q -8 0 -8 -8 V 126 Z" fill="#683f8f" stroke="#fff" stroke-width="1"/><text x="34" y="145" fill="#fff" font-size="16">story property </text><rect x="185.4" y="126" width="391.1499999999998" height="27" rx="6" fill="#fff"/><text x="193.4" y="145" fill="#172b40" font-size="15">[&quot;bubbleClosePolicies&quot;,&quot;after-3-seconds&quot;]</text><text x="581.5499999999998" y="145" fill="#fff" font-size="16"> = JSON </text><rect x="34" y="158" width="134.95000000000005" height="27" rx="6" fill="#fff"/><text x="42" y="177" fill="#172b40" font-size="15">{&quot;seconds&quot;:3}</text></g><g data-opcode="property"><path d="M 28 200 h 16 l 5 5 h 20 l 5 -5 H 732 q 8 0 8 8 V 273 q 0 8 -8 8 H 66 l -5 5 h -20 l -5 -5 H 28 q -8 0 -8 -8 V 210 Z" fill="#683f8f" stroke="#fff" stroke-width="1"/><text x="34" y="229" fill="#fff" font-size="16">story property </text><rect x="185.4" y="210" width="363.6999999999999" height="27" rx="6" fill="#fff"/><text x="193.4" y="229" fill="#172b40" font-size="15">[&quot;bubbleClosePolicies&quot;,&quot;user-advance&quot;]</text><text x="554.0999999999999" y="229" fill="#fff" font-size="16"> = JSON </text><rect x="34" y="242" width="208.15000000000006" height="27" rx="6" fill="#fff"/><text x="42" y="261" fill="#172b40" font-size="15">{&quot;waitFor&quot;:&quot;advance&quot;}</text></g><g data-opcode="property"><path d="M 28 284 h 16 l 5 5 h 20 l 5 -5 H 732 q 8 0 8 8 V 357 q 0 8 -8 8 H 66 l -5 5 h -20 l -5 -5 H 28 q -8 0 -8 -8 V 294 Z" fill="#683f8f" stroke="#fff" stroke-width="1"/><text x="34" y="313" fill="#fff" font-size="16">story property </text><rect x="185.4" y="294" width="418.59999999999974" height="27" rx="6" fill="#fff"/><text x="193.4" y="313" fill="#172b40" font-size="15">[&quot;bubbleClosePolicies&quot;,&quot;advance-or-timeout&quot;]</text><text x="608.9999999999998" y="313" fill="#fff" font-size="16"> = JSON </text><rect x="34" y="326" width="327.09999999999997" height="27" rx="6" fill="#fff"/><text x="42" y="345" fill="#172b40" font-size="15">{&quot;seconds&quot;:10,&quot;waitFor&quot;:&quot;advance&quot;}</text></g></g>
</svg>
