<svg xmlns="http://www.w3.org/2000/svg" width="760" height="196" viewBox="0 0 760 196" role="img" aria-labelledby="title desc">
<title id="title">BGMを止める、音量を変える（2/2）</title>
<desc id="desc">Issue #883の統一ハットとIssue #886の種類別定義ブロック。複数のハットは独立した台本として配置します。上から順につなぎ、シーンの命令はC字の内側に配置します。入力欄の長い値は図中だけで折り返しています。</desc>
<rect width="760" height="196" rx="12" fill="#f3f6fa"/>
<g font-family="ui-monospace, Menlo, monospace" font-weight="500"><text x="24" y="30" font-size="18" fill="#172b40">BGMを止める、音量を変える（2/2）</text><g data-opcode="setBgmVolume"><path d="M 28 64 h 16 l 5 5 h 20 l 5 -5 H 732 q 8 0 8 8 V 105 q 0 8 -8 8 H 66 l -5 5 h -20 l -5 -5 H 28 q -8 0 -8 -8 V 74 Z" fill="#086f78" stroke="#fff" stroke-width="1"/><text x="34" y="93" fill="#fff" font-size="16">set BGM volume to </text><rect x="214.67999999999998" y="74" width="34.3" height="27" rx="6" fill="#fff"/><text x="222.67999999999998" y="93" fill="#172b40" font-size="15">30</text><text x="253.97999999999996" y="93" fill="#fff" font-size="16"> % over </text><rect x="337.05999999999995" y="74" width="25.15" height="27" rx="6" fill="#fff"/><text x="345.05999999999995" y="93" fill="#172b40" font-size="15">1</text><text x="367.2099999999999" y="93" fill="#fff" font-size="16"> seconds</text></g><g data-opcode="stopBgm"><path d="M 28 116 h 16 l 5 5 h 20 l 5 -5 H 732 q 8 0 8 8 V 157 q 0 8 -8 8 H 66 l -5 5 h -20 l -5 -5 H 28 q -8 0 -8 -8 V 126 Z" fill="#086f78" stroke="#fff" stroke-width="1"/><text x="34" y="145" fill="#fff" font-size="16">stop BGM over </text><rect x="175.64000000000001" y="126" width="25.15" height="27" rx="6" fill="#fff"/><text x="183.64000000000001" y="145" fill="#172b40" font-size="15">2</text><text x="205.79000000000002" y="145" fill="#fff" font-size="16"> seconds</text></g></g>
</svg>
