<svg xmlns="http://www.w3.org/2000/svg" width="760" height="254" viewBox="0 0 760 254" role="img" aria-labelledby="title desc">
<title id="title">再読み込みに備えてstableIdを付ける</title>
<desc id="desc">Issue #883の新ハット形式の台本ブロック。複数のハットは独立した台本として配置します。上から順につなぎ、シーンの命令はC字の内側に配置します。入力欄の長い値は図中だけで折り返しています。</desc>
<rect width="760" height="254" rx="12" fill="#f3f6fa"/>
<g font-family="ui-monospace, Menlo, monospace" font-weight="500"><text x="24" y="30" font-size="18" fill="#172b40">再読み込みに備えてstableIdを付ける</text><g data-opcode="actionOptions"><path d="M 28 64 h 16 l 5 5 h 20 l 5 -5 H 732 q 8 0 8 8 V 137 q 0 8 -8 8 H 52 q -8 0 -8 8 V 195 q 0 8 8 8 H 732 q 8 0 8 8 V 215 q 0 8 -8 8 H 66 l -5 5 h -20 l -5 -5 H 28 q -8 0 -8 -8 V 72 q 0 -8 8 -8 Z" fill="#683f8f" stroke="#fff" stroke-width="1"/><text x="34" y="93" fill="#fff" font-size="16">action options JSON </text><rect x="34" y="106" width="619.8999999999993" height="27" rx="6" fill="#fff"/><text x="42" y="125" fill="#172b40" font-size="15">{&quot;arguments&quot;:{&quot;stableId&quot;:&quot;waitBeforeEnding&quot;},&quot;textFormat&quot;:&quot;plain&quot;}</text><g data-opcode="wait"><path d="M 52 149 h 16 l 5 5 h 20 l 5 -5 H 732 q 8 0 8 8 V 190 q 0 8 -8 8 H 90 l -5 5 h -20 l -5 -5 H 52 q -8 0 -8 -8 V 159 Z" fill="#086f78" stroke="#fff" stroke-width="1"/><text x="58" y="178" fill="#fff" font-size="16">wait </text><rect x="111.8" y="159" width="25.15" height="27" rx="6" fill="#fff"/><text x="119.8" y="178" fill="#172b40" font-size="15">1</text><text x="141.95" y="178" fill="#fff" font-size="16"> seconds</text></g></g></g>
</svg>
