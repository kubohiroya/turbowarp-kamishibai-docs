<svg xmlns="http://www.w3.org/2000/svg" width="760" height="144" viewBox="0 0 760 144" role="img" aria-labelledby="title desc">
<title id="title">SVG Textを設定する</title>
<desc id="desc">Issue #881の開発版の台本ブロック。上から順につなぎ、シーンの命令はC字の内側に配置します。入力欄の長い値は図中だけで折り返しています。</desc>
<rect width="760" height="144" rx="12" fill="#f3f6fa"/>
<g font-family="ui-monospace, Menlo, monospace" font-weight="500"><text x="24" y="30" font-size="18" fill="#172b40">SVG Textを設定する</text><g data-opcode="setText"><path d="M 28 64 h 16 l 5 5 h 20 l 5 -5 H 732 q 8 0 8 8 V 105 q 0 8 -8 8 H 66 l -5 5 h -20 l -5 -5 H 28 q -8 0 -8 -8 V 74 Z" fill="#086f78" stroke="#fff" stroke-width="1"/><text x="34" y="93" fill="#fff" font-size="16">set text actor </text><rect x="185.4" y="74" width="80.05" height="27" rx="6" fill="#fff"/><text x="193.4" y="93" fill="#172b40" font-size="15">Caption</text><text x="270.45" y="93" fill="#fff" font-size="16"> to </text><rect x="314.49" y="74" width="76" height="27" rx="6" fill="#fff"/><text x="322.49" y="93" fill="#172b40" font-size="15">おしまい</text><text x="395.49" y="93" fill="#fff" font-size="16"> style </text><rect x="468.81" y="74" width="61.75" height="27" rx="6" fill="#fff"/><text x="476.81" y="93" fill="#172b40" font-size="15">title</text></g></g>
</svg>
