<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-labelledby="title desc">
<title id="title">切り替え方を指定する</title>
<desc id="desc">Issue #883の統一ハットとIssue #886の種類別定義ブロック。複数のハットは独立した台本として配置します。上から順につなぎ、シーンの命令はC字の内側に配置します。入力欄の長い値は図中だけで折り返しています。</desc>
<rect width="760" height="260" rx="12" fill="#f3f6fa"/>
<g font-family="ui-monospace, Menlo, monospace" font-weight="500"><text x="24" y="30" font-size="18" fill="#172b40">切り替え方を指定する</text><g data-opcode="property"><path d="M 28 64 h 16 l 5 5 h 20 l 5 -5 H 732 q 8 0 8 8 V 137 q 0 8 -8 8 H 66 l -5 5 h -20 l -5 -5 H 28 q -8 0 -8 -8 V 74 Z" fill="#683f8f" stroke="#fff" stroke-width="1"/><text x="34" y="93" fill="#fff" font-size="16">story property </text><rect x="185.4" y="74" width="290.50000000000006" height="27" rx="6" fill="#fff"/><text x="193.4" y="93" fill="#172b40" font-size="15">[&quot;presentation&quot;,&quot;transitions&quot;]</text><text x="480.9000000000001" y="93" fill="#fff" font-size="16"> = JSON </text><rect x="34" y="106" width="629.0499999999993" height="27" rx="6" fill="#fff"/><text x="42" y="125" fill="#172b40" font-size="15">{&quot;scene&quot;:0.5,&quot;backdrop&quot;:0.3,&quot;actorSkin&quot;:0.2,&quot;actorVisibility&quot;:0.15}</text></g><g data-opcode="property"><path d="M 28 148 h 16 l 5 5 h 20 l 5 -5 H 732 q 8 0 8 8 V 221 q 0 8 -8 8 H 66 l -5 5 h -20 l -5 -5 H 28 q -8 0 -8 -8 V 158 Z" fill="#683f8f" stroke="#fff" stroke-width="1"/><text x="34" y="177" fill="#fff" font-size="16">story property </text><rect x="185.4" y="158" width="153.25000000000003" height="27" rx="6" fill="#fff"/><text x="193.4" y="177" fill="#172b40" font-size="15">[&quot;audio&quot;,&quot;bgm&quot;]</text><text x="343.65000000000003" y="177" fill="#fff" font-size="16"> = JSON </text><rect x="34" y="190" width="674.7999999999992" height="27" rx="6" fill="#fff"/><text x="42" y="209" fill="#172b40" font-size="15">{&quot;transition&quot;:{&quot;effect&quot;:&quot;crossfade&quot;,&quot;seconds&quot;:1.5,&quot;curve&quot;:&quot;equalPower&quot;}}</text></g></g>
</svg>
