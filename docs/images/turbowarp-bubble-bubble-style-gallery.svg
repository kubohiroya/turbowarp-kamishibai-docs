<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="750" viewBox="0 0 1600 750" role="img" aria-labelledby="title description">
  <title id="title">Bubble visual style一覧</title>
  <desc id="description">NORMAL、THINKING、DREAMING、YELLING、OFF_PANEL、WAVY、WHISPERING、ANNOUNCEMENT、NARRATION、NO_BUBBLEのSVG形状例。</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
    .heading { fill: #25283a; font-size: 28px; font-weight: 700; }
    .subheading { fill: #25283a; font-size: 20px; font-weight: 700; }
    .body { fill: #25283a; font-size: 16px; }
    .small { fill: #667085; font-size: 13px; }
    .block-text { fill: #ffffff; font-size: 13px; font-weight: 600; }
    .input-text { fill: #25283a; font-size: 13px; font-weight: 500; }
  </style>

  <rect width="1600" height="750" fill="#f2f4f8"/>
  <text x="32" y="48" class="heading">Bubble visual style：形状の使い分け</text>
  <text x="32" y="78" class="body">すべてBubble側の共有SVG形状rendererから生成。NEGATIVEは色指定で表現するため独立styleにしません。</text>
  <text x="32" y="101" class="small">形状renderer基盤の仕様例です。standalone surfaceへのstyle block/API接続は後続実装です。</text>
