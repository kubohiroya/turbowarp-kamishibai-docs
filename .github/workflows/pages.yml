name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types: [app-release-published]
  schedule:
    # More opportunities to recover when GitHub delays or drops a scheduled event.
    - cron: '17,47 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ github.event_name != 'schedule' || steps.release.outputs.changed == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve and verify the published app dependency
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          COMPARE_PUBLISHED_APP_RELEASE: ${{ github.event_name == 'schedule' }}
        run: pnpm docs:app:sync
      - run: pnpm check
        if: github.event_name != 'schedule' || steps.release.outputs.changed == 'true'
      - uses: actions/configure-pages@v6
        if: github.event_name != 'schedule' || steps.release.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'schedule' || steps.release.outputs.changed == 'true'
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.publish == 'true'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
